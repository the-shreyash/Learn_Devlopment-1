<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan & Rowspan Attributes    </title>
</head>
<body>
    <TABLe border="black">
        <caption>food menu</caption>

        <thead>
            <tr>
                <th rowspan="2">item</th>
                <th colspan="2">prize</th>
            </tr>
            

            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
            
        </thead>
        
        

        <tbody>
            <tr>
                <td>biscuit</td>
                <td>10</td>
                <td>0.14$</td>
            </tr>
            <tr>
                <td>frooti</td>
                <td>15</td>
                <td>1$</td>
            </tr>

            <TR>
                <td>samosa</td>
                <td>20</td>
                <td>0.75$</td>
            </TR>

        </tbody>
    </TABLe>
    
</body>
</html>
