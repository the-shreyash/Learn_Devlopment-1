<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table tag</title>
</head>
<body>
    <table>
        <caption>food menu</caption>

        <thead>
            <tr>
                <th>item</th>
                <th>prize</th>
            </tr>
        </thead>
      <tbody>
        <tr>
            <td>biscuit</td>
            <td>10</td>
        </tr>
        <tr>
            <td>samosa</td>
            <td>15</td>
        </tr>
        <tr>
            <td>namkin</td>
            <td>50</td>
        </tr>
      </tbody>

       
    </table>
</body>
</html>
